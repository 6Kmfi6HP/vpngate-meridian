name: VPNGate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      requests:
        description: "Number of VPN Gate API requests to run"
        required: false
        default: "100"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: vpngate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 14.x

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  collect:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    env:
      OUTPUT_DIR: public
      STATE_PATH: public/state/servers.json
      ACTIVE_MISS_LIMIT: "3"
      PRUNE_MISS_LIMIT: "24"
      TOTAL_REQUESTS: ${{ github.event_name == 'schedule' && '1500' || github.event.inputs.requests || '100' }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 14.x

      - name: Install dependencies
        run: npm ci

      - name: Restore previous incremental state
        run: |
          mkdir -p public/state
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1
            git show origin/gh-pages:state/servers.json > public/state/servers.json || true
          fi

      - name: Collect VPN Gate data
        run: npm start

      - name: Validate generated output
        run: |
          test -s public/README.md
          test -s public/json/data.json
          test -s public/json/changes.json
          test -s public/state/servers.json

      - name: Upload generated output artifact
        uses: actions/upload-artifact@v7
        with:
          name: vpngate-generated-output
          path: public
          retention-days: 7

      - name: Publish generated data to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          touch .nojekyll
          git init
          git checkout -B gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update generated VPN data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
